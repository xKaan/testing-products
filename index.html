<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produits disponibles</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; }

    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .navbar-brand { font-weight: 800; font-size: 1.25rem; letter-spacing: 0.05em; }
    .navbar a { color: #374151; text-decoration: none; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 0.375rem; }
    .navbar a:hover { background: #f3f4f6; }

    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

    .page-title { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .page-title h1 { margin: 0; font-size: 1.875rem; }
    .badge { background: #7c3aed; color: #fff; border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.85rem; font-weight: 600; }

    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    #recherche { flex: 1; min-width: 200px; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 0.95rem; }
    #tri, #reset-filtres { padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; background: #fff; font-size: 0.95rem; cursor: pointer; }
    #reset-filtres:hover { background: #f3f4f6; }

    #liste-produits { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; list-style: none; margin: 0; padding: 0; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 0.5rem; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); padding: 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .card-title { margin: 0; font-size: 1.1rem; font-weight: 700; }
    .card p { margin: 0; font-size: 0.9rem; color: #374151; }
    .btn-ajouter { margin-top: 0.5rem; background: #7c3aed; color: #fff; border: none; border-radius: 0.375rem; padding: 0.6rem 1rem; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; cursor: pointer; }
    .btn-ajouter:hover { background: #6d28d9; }

    .empty { color: #9ca3af; text-align: center; padding: 2rem; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header class="navbar">
    <span class="navbar-brand">🛒 CoursesApp</span>
    <nav>
      <a href="/liste.html">Liste de course</a>
    </nav>
  </header>

  <main>
    <div class="page-title">
      <h1>Produits disponibles</h1>
      <span id="compteur-produits" class="badge"></span>
    </div>

    <div class="controls">
      <input type="search" id="recherche" placeholder="Rechercher un produit..." />
      <select id="tri">
        <option value="nom">Trier par nom</option>
        <option value="prix">Trier par prix</option>
      </select>
      <button id="reset-filtres" type="button">Réinitialiser</button>
    </div>

    <ul id="liste-produits"></ul>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
